<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LOR. meeting workspace preview</title>
  <desc id="desc">A synthetic dark LOR. meeting view with two call tiles, live captions, and a retained meeting record.</desc>
  <rect width="1440" height="900" fill="#0a0a0b"/>
  <rect x="36" y="32" width="1368" height="836" rx="18" fill="#141416" stroke="#2a2a2e" stroke-width="2"/>

  <!-- compact room header -->
  <rect x="36" y="32" width="1368" height="72" rx="18" fill="#1e1e21"/>
  <path d="M36 104h1368" stroke="#2a2a2e" stroke-width="2"/>
  <text x="78" y="76" fill="#f4f4f5" font-family="Arial, sans-serif" font-size="28" font-weight="700">LOR.</text>
  <circle cx="156" cy="68" r="7" fill="#f87171"/>
  <text x="176" y="76" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="19">LIVE CALL</text>
  <text x="1262" y="76" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="18" text-anchor="end">2 people</text>

  <!-- call stage -->
  <rect x="68" y="136" width="884" height="564" rx="14" fill="#0a0a0b" stroke="#2a2a2e" stroke-width="2"/>
  <rect x="92" y="160" width="412" height="516" rx="12" fill="#1e1e21"/>
  <rect x="516" y="160" width="412" height="516" rx="12" fill="#1e1e21"/>
  <circle cx="298" cy="362" r="88" fill="#2a2a2e"/>
  <circle cx="722" cy="362" r="88" fill="#2a2a2e"/>
  <path d="M254 360c18-33 68-33 86 0" fill="none" stroke="#a1a1aa" stroke-width="12" stroke-linecap="round"/>
  <path d="M670 360c18-33 68-33 86 0" fill="none" stroke="#a1a1aa" stroke-width="12" stroke-linecap="round"/>
  <circle cx="270" cy="338" r="12" fill="#a1a1aa"/>
  <circle cx="694" cy="338" r="12" fill="#a1a1aa"/>
  <text x="124" y="642" fill="#f4f4f5" font-family="Arial, sans-serif" font-size="20">You</text>
  <text x="548" y="642" fill="#f4f4f5" font-family="Arial, sans-serif" font-size="20">Guest</text>
  <circle cx="184" cy="635" r="6" fill="#f87171"/>
  <text x="204" y="642" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="16">speaking</text>
  <circle cx="608" cy="635" r="6" fill="#a1a1aa"/>
  <text x="628" y="642" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="16">ready</text>

  <!-- live caption strip -->
  <rect x="68" y="724" width="884" height="72" rx="10" fill="#1e1e21" stroke="#2a2a2e" stroke-width="2"/>
  <circle cx="100" cy="760" r="6" fill="#f87171"/>
  <text x="122" y="766" fill="#f4f4f5" font-family="Arial, sans-serif" font-size="20">Captions live · English + Arabic</text>

  <!-- retained record panel -->
  <rect x="984" y="136" width="388" height="660" rx="14" fill="#1e1e21" stroke="#2a2a2e" stroke-width="2"/>
  <text x="1020" y="188" fill="#f4f4f5" font-family="Arial, sans-serif" font-size="24" font-weight="700">Meeting record</text>
  <text x="1020" y="220" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="16">Retained evidence stays scoped to this room.</text>
  <path d="M1020 248h316" stroke="#2a2a2e" stroke-width="2"/>
  <text x="1020" y="290" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="16">TRANSCRIPT</text>
  <rect x="1020" y="312" width="316" height="12" rx="6" fill="#2a2a2e"/>
  <rect x="1020" y="338" width="250" height="12" rx="6" fill="#2a2a2e"/>
  <rect x="1020" y="364" width="284" height="12" rx="6" fill="#2a2a2e"/>
  <text x="1020" y="428" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="16">DECISION · HOST REVIEWED</text>
  <rect x="1020" y="450" width="316" height="106" rx="9" fill="#141416" stroke="#2a2a2e" stroke-width="2"/>
  <rect x="1044" y="478" width="256" height="12" rx="6" fill="#a1a1aa" opacity=".7"/>
  <rect x="1044" y="504" width="198" height="12" rx="6" fill="#a1a1aa" opacity=".45"/>
  <text x="1020" y="614" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="16">SOURCE</text>
  <rect x="1020" y="636" width="142" height="34" rx="7" fill="#2a2a2e"/>
  <text x="1091" y="659" fill="#f4f4f5" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Open quote</text>
  <text x="1020" y="734" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="15">Synthetic preview · no meeting data</text>
</svg>
