name: Feature request
description: Suggest something LOR should do.
labels: ['type:feat']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it is done?
      value: |
        - [ ]
        - [ ]

  - type: dropdown
    id: milestone
    attributes:
      label: Which planned release does this belong to?
      description: See the roadmap in the README.
      options:
        - 'v0.8 — Integrations'
        - 'v0.9 — Hardening and self-hosting'
        - 'v1.0 — Plugin ecosystem'
        - "Not sure"
