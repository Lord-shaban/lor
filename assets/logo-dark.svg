    <path d="M12 20 V108 H66" />
    <circle cx="138" cy="70" r="38" />
    <path d="M222 20 V120" />
    <path d="M222 32 H244 A22 22 0 0 1 244 76 H222" />
    <path d="M222 76 L260 113" />
  </g>
  <circle cx="317" cy="105" r="15" fill="#818cf8" />
</svg>
